<!DOCTYPE html>
<html lang="en" manifest="clock.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Desk Clock</title>
<!--
  Written for iOS 9 Safari (iPhone 4s): ES5 only, XMLHttpRequest instead of fetch,
  no CSS variables, prefixed flexbox, WOFF (not WOFF2) fonts. Keep it that way
  when adding features.
-->
<style>
  /* Inter by Rasmus Andersson, SIL Open Font License 1.1 (fonts/Inter-LICENSE.txt) */
  @font-face {
    font-family: 'Inter';
    font-weight: 300;
    src: url('fonts/inter-latin-300-normal.woff') format('woff');
  }
  @font-face {
    font-family: 'Inter';
    font-weight: 400;
    src: url('fonts/inter-latin-400-normal.woff') format('woff');
  }
  /* Inter Tight: Inter's display cut, spaced for large sizes (OFL 1.1, fonts/InterTight-LICENSE.txt) */
  @font-face {
    font-family: 'Inter Tight';
    font-weight: 500;
    src: url('fonts/inter-tight-latin-500-normal.woff') format('woff');
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #f2f2f2;
    font-family: Inter, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
    -webkit-transition: background-color 0.4s, color 0.4s;
    transition: background-color 0.4s, color 0.4s;
  }

  /* ---- Layout ------------------------------------------------------------
     Landscape (default): clock, dates and weather on the left, prayer times
     in a column on the right. Portrait: everything stacked, prayers in a
     3 x 2 grid at the bottom. */
  #app {
    height: 100%;
    padding: 0 5vw;  /* landscape side margins (left and right) */
    box-sizing: border-box;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  #main {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    text-align: center;
  }

  /* ---- Clock -------------------------------------------------------------
     Type hierarchy: one dominant element (the time), then small, widely
     tracked labels. Display type gets tighter tracking, small caps looser. */
  #time {
    font-family: 'Inter Tight', Inter, -apple-system, "Helvetica Neue", sans-serif;
    font-weight: 500;
    font-size: 21vw;     /* widest time ("04:44") is 2.7em */
    line-height: 0.8;    /* trim the empty space above the digits */
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  /* Seconds bar: fills smoothly over each minute. Sized by #clock, which
     shrink-wraps the time, so the bar spans exactly the digits. */
  #seconds {
    position: relative;
    height: 3px;
    margin-top: 2.4vw;
    border-radius: 2px;
    overflow: hidden;
    background: rgba(255,255,255,0.26);
    /* Make WebKit clip the transformed child to the rounded corners */
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }
  #seconds-fill {
    width: 100%;
    height: 100%;
    border-radius: 2px;
    background: #f2f2f2;
    -webkit-transform: translate3d(-100%, 0, 0);
    transform: translate3d(-100%, 0, 0);
  }

  /* ---- Dates: weekday, then Gregorian and Hijri ------------------------- */
  #dates { margin-top: 2.6vw; text-transform: uppercase; }
  #weekday {
    font-size: 2.9vw;
    letter-spacing: 0.22em;
    color: #d8d8d8;
  }
  #greg, #hijri {
    margin-top: 0.9vw;
    font-size: 2.5vw;
    letter-spacing: 0.14em;
    color: #8f8f8f;
  }

  /* ---- Weather ----------------------------------------------------------- */
  #weather {
    margin-top: 3.2vw;
    color: #d8d8d8;
    opacity: 0;
    -webkit-transition: opacity 0.6s;
    transition: opacity 0.6s;
  }
  #weather.ready { opacity: 1; }
  .w-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  /* The temperature's digits are sized to roughly the height of the three
     detail lines next to it (3 x 2.4vw x 1.35 = ~9.7vw); Inter Tight digits
     are 0.74em tall and sit low in the line box, hence the nudge up. */
  #w-icon { font-size: 11vw; line-height: 1; margin-right: 1.5vw; }
  #w-temp {
    font-family: 'Inter Tight', Inter, -apple-system, "Helvetica Neue", sans-serif;
    font-weight: 500;
    font-size: 11vw;
    line-height: 1;
    letter-spacing: -0.02em;
    position: relative;
    top: -0.06em;
    margin-right: 2vw;
  }
  #w-detail { text-align: left; font-size: 2.4vw; line-height: 1.35; color: #9a9a9a; }
  /* wttr.in descriptions can be long ("Patchy light rain in area with
     thunder"); keep them to the width of the lines below. */
  #w-desc {
    max-width: 29vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Apple's emoji are drawn smaller within their box than Windows' */
  .ios #w-icon { font-size: 16vw; }
  #w-desc { color: #d8d8d8; }

  /* ---- Prayer times ------------------------------------------------------ */
  /* #side fills the space right of the clock with the prayers pushed to its
     far edge, so its ::before can draw the divider midway across the gap.
     21.8vw is the #prayers width (.prayer width minus its negative margins);
     3vw is the minimum gap, kept as #main's right margin. */
  #main { margin-right: 3vw; }
  #side {
    position: relative;
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: end;
    -webkit-justify-content: flex-end;
    justify-content: flex-end;
  }
  #side::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc((100% - 24.8vw) / 2 - 1px);
    width: 2px;
    background: rgba(255,255,255,0.26);
    -webkit-transition: background-color 0.4s;
    transition: background-color 0.4s;
  }
  .prayer {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    width: 25vw;
    /* Horizontal padding gives the highlight room around the text; the
       matching negative margin keeps it from changing the layout. */
    margin: 0 -1.6vw;
    padding: 1.9vw 1.6vw;
    border-radius: 1.8vw;
    color: #8f8f8f;
    -webkit-transition: background-color 0.4s, color 0.4s;
    transition: background-color 0.4s, color 0.4s;
  }
  .p-name {
    font-size: 2.2vw;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  .p-time {
    font-family: 'Inter Tight', Inter, -apple-system, "Helvetica Neue", sans-serif;
    font-weight: 500;
    font-size: 4vw;
    color: #d8d8d8;
  }
  /* The current prayer sits on a rounded highlight */
  .prayer.current { background: rgba(255,255,255,0.20); }
  .prayer.current, .prayer.current .p-time { color: #fff; }

  /* ---- Light theme (double-tap to switch) -------------------------------- */
  body.light { background: #f5f5f3; color: #111; }
  body.light #seconds { background: rgba(0,0,0,0.1); }
  body.light #seconds-fill { background: #111; }
  body.light #weekday { color: #2a2a2a; }
  body.light #greg, body.light #hijri { color: #5c5c5c; }
  body.light #weather, body.light #w-desc { color: #2a2a2a; }
  body.light #w-detail { color: #5f5f5f; }
  body.light #prayers { border-color: rgba(0,0,0,0.12); }
  body.light #side::before { background: rgba(0,0,0,0.12); }
  body.light .prayer { color: #5f5f5f; }
  body.light .p-time { color: #2a2a2a; }
  body.light .prayer.current { background: rgba(0,0,0,0.07); }
  body.light .prayer.current, body.light .prayer.current .p-time { color: #000; }

  #weekday, #greg, #hijri, #weather, #w-desc, #w-detail, #prayers, .p-time {
    -webkit-transition: color 0.4s, border-color 0.4s;
    transition: color 0.4s, border-color 0.4s;
  }

  /* ---- Portrait: stack everything, prayers as a 3 x 2 grid --------------- */
  @media (orientation: portrait) {
    #app {
      padding: 0;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }
    #time { font-size: 31vw; }
    #seconds { margin-top: 3.6vw; }
    #dates { margin-top: 4vw; }
    #weekday { font-size: 4.2vw; }
    #greg, #hijri { font-size: 3.6vw; margin-top: 1.4vw; }
    #weather { margin-top: 6vw; }
    #w-icon { font-size: 11vw; }
    .ios #w-icon { font-size: 13.75vw; }
    #w-temp { font-size: 16vw; }
    #w-detail { font-size: 3.5vw; }
    #w-desc { max-width: 42vw; }

    #main { margin-right: 0; }
    #side {
      -webkit-box-flex: 0;
      -webkit-flex: none;
      flex: none;
      display: block;
    }
    #side::before { display: none; }

    #prayers {
      margin: 7vw 0 0;
      padding: 3vw 0 0;
      border-top: 1px solid rgba(255,255,255,0.13);
      width: 88vw;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
    }
    .prayer {
      width: 31.333%;
      margin: 0 1%;
      border-radius: 2.6vw;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 2.2vw 0;
    }
    .p-name { font-size: 3.2vw; margin-bottom: 1vw; }
    .p-time { font-size: 6.4vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="clock">
      <div id="time">--:--</div>
      <div id="seconds"><div id="seconds-fill"></div></div>
    </div>
    <div id="dates">
      <div id="weekday">&nbsp;</div>
      <div id="greg">&nbsp;</div>
      <div id="hijri">&nbsp;</div>
    </div>
    <div id="weather">
      <div class="w-row">
        <div id="w-icon"></div>
        <div id="w-temp"></div>
        <div id="w-detail">
          <div id="w-desc"></div>
          <div id="w-extra"></div>
          <div id="w-extra2"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="side">
    <div id="prayers">
      <div class="prayer"><span class="p-name">Fajr</span><span class="p-time">--:--</span></div>
      <div class="prayer"><span class="p-name">Sunrise</span><span class="p-time">--:--</span></div>
      <div class="prayer"><span class="p-name">Dhuhr</span><span class="p-time">--:--</span></div>
      <div class="prayer"><span class="p-name">Asr</span><span class="p-time">--:--</span></div>
      <div class="prayer"><span class="p-name">Maghrib</span><span class="p-time">--:--</span></div>
      <div class="prayer"><span class="p-name">Isha</span><span class="p-time">--:--</span></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Settings -------------------------------------------------------
  var CONFIG = {
    location: '43.4516,-80.4925',  // weather for Kitchener; coordinates skip wttr.in's name lookup
    units: 'C',            // 'C' or 'F'
    refreshMinutes: 60,
    retryMinutes: 2
    // Prayer-time location and method are set in build.py (PRAYER_LOCATION).
  };

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];
  // Plain spellings: the API's transliterations use accented letters the
  // bundled (Latin-only) font doesn't have.
  var HIJRI_MONTHS = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Ula',
                      'Jumada al-Akhirah', 'Rajab', "Sha'ban", 'Ramadan', 'Shawwal',
                      "Dhu al-Qa'dah", 'Dhu al-Hijjah'];
  var PRAYERS = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
  var SUNRISE = 1, MAGHRIB = 4;

  // Apple's emoji render smaller than other platforms'; CSS sizes them up.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
    document.documentElement.className += ' ios';
  }

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hhmm(date) { return pad(date.getHours()) + ':' + pad(date.getMinutes()); }

  // Only touch the DOM when the text actually changes.
  function setHtml(el, html) {
    if (el._html === html) return;
    el._html = html;
    el.innerHTML = html;
  }

  // localStorage can throw (private mode), so every access is guarded.
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function remove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  // ---- Clock ----------------------------------------------------------
  function renderClock() {
    var now = new Date();
    setHtml($('time'), hhmm(now));
    setHtml($('weekday'), DAYS[now.getDay()]);
    setHtml($('greg'), now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear());
  }

  // The seconds bar is one CSS transition per minute (from wherever we are
  // now to full, linear), not per-frame JavaScript: the compositor animates
  // it smoothly, which is far cheaper on the 4s than redrawing every frame.
  var secondsFill = $('seconds-fill');

  function setFill(fraction, transition) {
    var t = transition ? '-webkit-transform ' + transition + 'ms linear' : 'none';
    secondsFill.style.webkitTransition = t;
    secondsFill.style.transition = transition ? 'transform ' + transition + 'ms linear' : 'none';
    var x = 'translate3d(' + ((fraction - 1) * 100) + '%, 0, 0)';
    secondsFill.style.webkitTransform = x;
    secondsFill.style.transform = x;
  }

  function syncSeconds() {
    var now = new Date();
    var ms = now.getSeconds() * 1000 + now.getMilliseconds();
    setFill(ms / 60000, 0);
    secondsFill.offsetWidth;  // force a layout so the jump isn't animated
    setFill(1, 60000 - ms);
  }

  var lastMinute = -1;
  function tick() {
    renderClock();
    var minute = new Date().getMinutes();
    if (minute !== lastMinute) {
      lastMinute = minute;
      syncSeconds();
      renderPrayers();
      if (lastWeather) renderWeather(lastWeather);
    }
    // Re-sync to the top of each second so the minute flips on time.
    setTimeout(tick, 1000 - (new Date().getMilliseconds()) + 5);
  }

  // ---- Prayer times & Hijri date ---------------------------------------
  // prayers.json is generated by build.py from AlAdhan (ISNA, Kitchener) and
  // served from this site: iOS 9 can't verify api.aladhan.com's certificate,
  // so the phone never calls it directly. The file is part of the offline
  // cache, and a monthly scheduled build keeps it current.
  var prayerData = null;

  function dayEntry(date) {
    var month = prayerData && prayerData[date.getFullYear() + '-' + pad(date.getMonth() + 1)];
    return (month && month[date.getDate() - 1]) || null;
  }

  var prayerRetry = null;
  function loadPrayers() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'prayers.json', true);
    xhr.timeout = 20000;
    xhr.onload = function () {
      try {
        prayerData = JSON.parse(xhr.responseText);
        renderPrayers();
        return;
      } catch (e) {}
      retryPrayers();
    };
    xhr.onerror = xhr.ontimeout = retryPrayers;
    xhr.send();
  }

  function retryPrayers() {
    clearTimeout(prayerRetry);
    prayerRetry = setTimeout(loadPrayers, CONFIG.retryMinutes * 60 * 1000);
  }

  // The previous version cached months in localStorage under 'pt:' keys.
  function clearOldPrayerCache() {
    var stale = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        if (localStorage.key(i).indexOf('pt:') === 0) stale.push(localStorage.key(i));
      }
    } catch (e) {}
    for (var j = 0; j < stale.length; j++) remove(stale[j]);
  }

  var prayerRows = $('prayers').children;

  function renderPrayers() {
    var now = new Date();
    var today = dayEntry(now);
    setHtml($('hijri'), today
      ? today.h[0] + ' ' + HIJRI_MONTHS[today.h[1] - 1] + ' ' + today.h[2] + ' AH'
      : '&nbsp;');
    if (!today) return;

    // The current prayer is the last one whose time has started: Asr stays
    // highlighted until Maghrib, and so on. Before Fajr it's still the
    // previous night's Isha. "HH:MM" strings compare correctly as strings.
    var nowStr = hhmm(now);
    var current = PRAYERS.length - 1;
    for (var i = 0; i < PRAYERS.length; i++) {
      if (today.t[i] <= nowStr) current = i;
    }

    for (var r = 0; r < prayerRows.length; r++) {
      var row = prayerRows[r];
      var cls = 'prayer' + (r === current ? ' current' : '');
      if (row.className !== cls) row.className = cls;
      setHtml(row.children[1], today.t[r]);
    }
  }

  // ---- Theme ----------------------------------------------------------
  // Double-tap anywhere to switch between dark and light. iOS Safari doesn't
  // fire dblclick for touches, so detect two quick taps by hand.
  var theme = load('theme', 'dark');

  function applyTheme() {
    document.body.className = theme === 'light' ? 'light' : '';
  }

  function toggleTheme() {
    theme = theme === 'light' ? 'dark' : 'light';
    save('theme', theme);
    applyTheme();
  }

  var lastTap = { time: 0, x: 0, y: 0 };
  var lastTouch = 0;
  document.addEventListener('touchend', function (e) {
    lastTouch = Date.now();
    if (e.touches.length || e.changedTouches.length !== 1) return;
    var t = e.changedTouches[0];
    var now = Date.now();
    if (now - lastTap.time < 350 &&
        Math.abs(t.pageX - lastTap.x) < 40 && Math.abs(t.pageY - lastTap.y) < 40) {
      e.preventDefault();
      lastTap.time = 0;
      toggleTheme();
    } else {
      lastTap = { time: now, x: t.pageX, y: t.pageY };
    }
  }, false);

  // Mouse double-clicks, for testing on a computer. Ignored right after a
  // touch so a browser that does fire dblclick for taps doesn't toggle twice.
  document.addEventListener('dblclick', function () {
    if (Date.now() - lastTouch > 1000) toggleTheme();
  }, false);

  // ---- Weather --------------------------------------------------------
  // wttr.in weather codes (WorldWeatherOnline) -> emoji
  function iconFor(code, isNight) {
    code = parseInt(code, 10);
    if (code === 113) return isNight ? '🌙' : '☀️';       // clear
    if (code === 116) return isNight ? '☁️' : '⛅️';       // partly cloudy
    if (code === 119 || code === 122) return '☁️';                   // cloudy
    if (code === 143 || code === 248 || code === 260) return '🌫';   // fog
    if (code === 200 || code >= 386) return '⛈';                          // thunder
    if ([179, 227, 230, 323, 326, 329, 332, 335, 338, 368, 371].indexOf(code) !== -1)
      return '❄️';                                                   // snow
    if ([182, 185, 281, 284, 311, 314, 317, 320, 350, 362, 365, 374, 377].indexOf(code) !== -1)
      return '🌨';                                                   // sleet
    return '🌧';                                                     // rain / drizzle
  }

  // Night = before sunrise or after Maghrib, from the prayer data when we
  // have it; otherwise a rough 6:00-20:00 day.
  function isNightNow() {
    var now = new Date();
    var today = dayEntry(now);
    if (today) {
      var t = hhmm(now);
      return t < today.t[SUNRISE] || t >= today.t[MAGHRIB];
    }
    return now.getHours() < 6 || now.getHours() >= 20;
  }

  // Chance of rain or snow for the 3-hour forecast slot covering the current
  // hour ("0", "300", ... "2100" in wttr.in's hourly data).
  function precipChance(today) {
    if (!today || !today.hourly) return null;
    var hhmmNum = new Date().getHours() * 100;
    var slot = null;
    for (var i = 0; i < today.hourly.length; i++) {
      if (parseInt(today.hourly[i].time, 10) <= hhmmNum) slot = today.hourly[i];
    }
    if (!slot) return null;
    return Math.max(parseInt(slot.chanceofrain, 10) || 0, parseInt(slot.chanceofsnow, 10) || 0);
  }

  // Last successful response. It's re-rendered every minute so the day/night
  // icon and the precipitation slot stay current between hourly fetches.
  var lastWeather = null;
  var lastWeatherAt = 0;

  function renderWeather(data) {
    var cur = data.current_condition[0];
    var today = data.weather && data.weather[0];
    var f = CONFIG.units === 'F';
    var temp = f ? cur.temp_F : cur.temp_C;
    var desc = (cur.weatherDesc[0].value || '').replace(/\s+$/, '');

    setHtml($('w-icon'), iconFor(cur.weatherCode, isNightNow()));
    setHtml($('w-temp'), temp + '&deg;');
    setHtml($('w-desc'), desc);

    var extra = [];
    if (today) {
      extra.push('H ' + (f ? today.maxtempF : today.maxtempC) + '&deg;  L ' +
                 (f ? today.mintempF : today.mintempC) + '&deg;');
    }
    extra.push('Feels ' + (f ? cur.FeelsLikeF : cur.FeelsLikeC) + '&deg;');
    setHtml($('w-extra'), extra.join(' &middot; '));

    var precip = precipChance(today);
    setHtml($('w-extra2'), 'Humidity ' + cur.humidity + '% &middot; Precip ' +
                           (precip === null ? '&ndash;' : precip + '%'));

    $('weather').className = 'ready';
  }

  // Prefer HTTPS (works once ISRG Root X1 is installed on the phone), but fall
  // back to plain HTTP if the TLS handshake fails. An HTTPS page can't make HTTP
  // requests at all, so the fallback only applies when the page is served over HTTP.
  var weatherProtocols = location.protocol === 'https:' ? ['https:'] : ['https:', 'http:'];
  var weatherProtocol = 0;

  function fetchWeather() {
    var url = weatherProtocols[weatherProtocol] + '//wttr.in/' +
              encodeURIComponent(CONFIG.location) + '?format=j1';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          renderWeather(data);
          lastWeather = data;
          lastWeatherAt = Date.now();
          schedule(CONFIG.refreshMinutes);
          return;
        } catch (e) {}
      }
      schedule(CONFIG.retryMinutes);
    };
    xhr.onerror = xhr.ontimeout = function () {
      // A connection-level failure on HTTPS is most likely a certificate
      // problem, so retry right away over the next protocol.
      if (weatherProtocol < weatherProtocols.length - 1) {
        weatherProtocol++;
        fetchWeather();
        return;
      }
      weatherProtocol = 0;
      schedule(CONFIG.retryMinutes);
    };
    xhr.send();
  }

  var weatherTimer = null;
  function schedule(minutes) {
    clearTimeout(weatherTimer);
    weatherTimer = setTimeout(fetchWeather, minutes * 60 * 1000);
  }

  // Timers don't run while the phone is locked, so on wake fetch only if the
  // last update is older than the refresh interval; otherwise wait out the rest.
  function refreshWeatherIfStale() {
    var age = Date.now() - lastWeatherAt;
    var interval = CONFIG.refreshMinutes * 60 * 1000;
    if (!lastWeatherAt || age >= interval) {
      fetchWeather();
    } else {
      schedule((interval - age) / 60000);
    }
  }

  // Timers pause while the phone is locked; refresh as soon as we're visible again.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { renderClock(); syncSeconds(); renderPrayers(); refreshWeatherIfStale(); }
  });

  // Stop iOS rubber-band scrolling in standalone mode.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);

  // ---- Offline cache --------------------------------------------------
  // When a new version is deployed, Safari downloads it in the background;
  // swap it in and reload. If the phone is offline, the update check just
  // fails quietly and the cached copy keeps running.
  var appCache = window.applicationCache;
  if (appCache) {
    appCache.addEventListener('updateready', function () {
      try { appCache.swapCache(); } catch (e) {}
      window.location.reload();
    }, false);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        try { appCache.update(); } catch (e) {}
      }
    });
  }

  applyTheme();
  clearOldPrayerCache();
  tick();
  loadPrayers();
  fetchWeather();
})();
</script>
</body>
</html>
