<!DOCTYPE html>
<html lang="en" manifest="clock.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Desk Clock</title>
<!--
  Written for iOS 9 Safari (iPhone 4s): ES5 only, XMLHttpRequest instead of fetch,
  no CSS variables, prefixed flexbox, WOFF (not WOFF2) fonts. Keep it that way
  when adding features.
-->
<style>
  /* DSEG by keshikan, SIL Open Font License 1.1 (fonts/DSEG-LICENSE.txt) */
  @font-face {
    font-family: 'DSEG7';
    src: url('fonts/DSEG7Classic-BoldItalic.woff') format('woff');
  }
  @font-face {
    font-family: 'DSEG14';
    src: url('fonts/DSEG14Classic-BoldItalic.woff') format('woff');
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #f2f2f2;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }

  #app {
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    text-align: center;
  }

  /* Segment displays: a dim "all segments on" layer sits behind the lit text,
     like the unlit segments of a real LCD. DSEG glyphs are fixed width, so
     the two layers line up exactly. */
  .segments {
    position: relative;
    display: inline-block;
    white-space: nowrap;
    line-height: 1;
  }
  .segments .ghost {
    position: absolute;
    left: 0;
    top: 0;
    color: #f2f2f2;
    opacity: 0.07;
  }
  .segments .lit { position: relative; }

  #time {
    font-family: 'DSEG7', monospace;
    font-size: 24vw;
  }
  #date {
    margin-top: 4vw;
    font-family: 'DSEG14', monospace;
    font-size: 5vw;
    word-spacing: 0.35em;
    color: #b5b5b5;
  }

  #weather {
    margin-top: 5vw;
    color: #d8d8d8;
    opacity: 0;
    -webkit-transition: opacity 0.6s;
    transition: opacity 0.6s;
  }
  #weather.ready { opacity: 1; }
  .w-row {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #w-icon { font-size: 7vw; margin-right: 2.5vw; }
  #w-temp { font-size: 7vw; font-weight: 200; margin-right: 3vw; }
  #w-detail { text-align: left; font-size: 3.2vw; line-height: 1.35; color: #9a9a9a; }
  #w-desc { color: #d8d8d8; }

  #w-row2 { margin-top: 2vw; font-size: 3.2vw; color: #9a9a9a; }
  #w-row2 .stat { margin: 0 2.5vw; }
  #w-row2 b { font-weight: 400; color: #d8d8d8; }

  /* Portrait: the screen is narrow, so size off the width more generously */
  @media (orientation: portrait) {
    #time { font-size: 26vw; }
    #date { font-size: 7vw; margin-top: 5vw; }
    #weather { margin-top: 12vw; }
    #w-icon, #w-temp { font-size: 10vw; }
    #w-detail, #w-row2 { font-size: 4.2vw; }
    #w-row2 { margin-top: 3vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="time" class="segments"><span class="ghost">88:88</span><span class="lit" id="hm">--:--</span></div>
  <div id="date" class="segments"><span class="ghost">~~~ ~~~ ~~</span><span class="lit" id="date-text"></span></div>
  <div id="weather">
    <div class="w-row">
      <div id="w-icon"></div>
      <div id="w-temp"></div>
      <div id="w-detail">
        <div id="w-desc"></div>
        <div id="w-extra"></div>
      </div>
    </div>
    <div class="w-row" id="w-row2">
      <span class="stat">Humidity <b id="w-humidity"></b></span>
      <span class="stat">Precip <b id="w-precip"></b></span>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---- Settings -------------------------------------------------------
  var CONFIG = {
    location: '',          // '' = detect from IP, or e.g. 'Waterloo,Canada'
    units: 'C',            // 'C' or 'F'
    refreshMinutes: 15,
    retryMinutes: 2
  };

  var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
                'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // ---- Clock ----------------------------------------------------------
  function renderClock() {
    var now = new Date();
    $('hm').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes());
    // Always 10 characters so it lines up with the ghost segments.
    $('date-text').innerHTML = DAYS[now.getDay()] + ' ' + MONTHS[now.getMonth()] + ' ' +
                               pad(now.getDate());
  }

  function tick() {
    renderClock();
    // Re-sync to the top of each second so the minute flips on time.
    setTimeout(tick, 1000 - (new Date().getMilliseconds()) + 5);
  }

  // ---- Weather --------------------------------------------------------
  // wttr.in weather codes (WorldWeatherOnline) -> emoji
  function iconFor(code, isNight) {
    code = parseInt(code, 10);
    if (code === 113) return isNight ? '🌙' : '☀️';       // clear
    if (code === 116) return isNight ? '☁️' : '⛅️';       // partly cloudy
    if (code === 119 || code === 122) return '☁️';                   // cloudy
    if (code === 143 || code === 248 || code === 260) return '🌫';   // fog
    if (code === 200 || code >= 386) return '⛈';                          // thunder
    if ([179, 227, 230, 323, 326, 329, 332, 335, 338, 368, 371].indexOf(code) !== -1)
      return '❄️';                                                   // snow
    if ([182, 185, 281, 284, 311, 314, 317, 320, 350, 362, 365, 374, 377].indexOf(code) !== -1)
      return '🌨';                                                   // sleet
    return '🌧';                                                     // rain / drizzle
  }

  function isNightNow() {
    var h = new Date().getHours();
    return h < 6 || h >= 20;
  }

  // Chance of rain or snow for the 3-hour forecast slot covering the current
  // hour ("0", "300", ... "2100" in wttr.in's hourly data).
  function precipChance(today) {
    if (!today || !today.hourly) return null;
    var hhmm = new Date().getHours() * 100;
    var slot = null;
    for (var i = 0; i < today.hourly.length; i++) {
      if (parseInt(today.hourly[i].time, 10) <= hhmm) slot = today.hourly[i];
    }
    if (!slot) return null;
    return Math.max(parseInt(slot.chanceofrain, 10) || 0, parseInt(slot.chanceofsnow, 10) || 0);
  }

  function renderWeather(data) {
    var cur = data.current_condition[0];
    var today = data.weather && data.weather[0];
    var f = CONFIG.units === 'F';
    var temp = f ? cur.temp_F : cur.temp_C;
    var desc = (cur.weatherDesc[0].value || '').replace(/\s+$/, '');

    $('w-icon').innerHTML = iconFor(cur.weatherCode, isNightNow());
    $('w-temp').innerHTML = temp + '&deg;';
    $('w-desc').innerHTML = desc;

    var extra = [];
    if (today) {
      extra.push('H ' + (f ? today.maxtempF : today.maxtempC) + '&deg;  L ' +
                 (f ? today.mintempF : today.mintempC) + '&deg;');
    }
    extra.push('Feels ' + (f ? cur.FeelsLikeF : cur.FeelsLikeC) + '&deg;');
    $('w-extra').innerHTML = extra.join(' &middot; ');

    var precip = precipChance(today);
    $('w-humidity').innerHTML = cur.humidity + '%';
    $('w-precip').innerHTML = precip === null ? '&ndash;' : precip + '%';

    $('weather').className = 'ready';
  }

  // Prefer HTTPS (works once ISRG Root X1 is installed on the phone), but fall
  // back to plain HTTP if the TLS handshake fails. An HTTPS page can't make HTTP
  // requests at all, so the fallback only applies when the page is served over HTTP.
  var weatherProtocols = location.protocol === 'https:' ? ['https:'] : ['https:', 'http:'];
  var weatherProtocol = 0;

  function fetchWeather() {
    var url = weatherProtocols[weatherProtocol] + '//wttr.in/' +
              encodeURIComponent(CONFIG.location) + '?format=j1';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (xhr.status === 200) {
        try {
          renderWeather(JSON.parse(xhr.responseText));
          schedule(CONFIG.refreshMinutes);
          return;
        } catch (e) {}
      }
      schedule(CONFIG.retryMinutes);
    };
    xhr.onerror = xhr.ontimeout = function () {
      // A connection-level failure on HTTPS is most likely a certificate
      // problem, so retry right away over the next protocol.
      if (weatherProtocol < weatherProtocols.length - 1) {
        weatherProtocol++;
        fetchWeather();
        return;
      }
      weatherProtocol = 0;
      schedule(CONFIG.retryMinutes);
    };
    xhr.send();
  }

  var weatherTimer = null;
  function schedule(minutes) {
    clearTimeout(weatherTimer);
    weatherTimer = setTimeout(fetchWeather, minutes * 60 * 1000);
  }

  // Timers pause while the phone is locked; refresh as soon as we're visible again.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { renderClock(); fetchWeather(); }
  });

  // Stop iOS rubber-band scrolling in standalone mode.
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);

  // ---- Offline cache --------------------------------------------------
  // When a new version is deployed, Safari downloads it in the background;
  // swap it in and reload. If the phone is offline, the update check just
  // fails quietly and the cached copy keeps running.
  var appCache = window.applicationCache;
  if (appCache) {
    appCache.addEventListener('updateready', function () {
      try { appCache.swapCache(); } catch (e) {}
      window.location.reload();
    }, false);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        try { appCache.update(); } catch (e) {}
      }
    });
  }

  tick();
  fetchWeather();
})();
</script>
</body>
</html>
